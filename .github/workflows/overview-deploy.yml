name: overview-deploy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Deployment action"
        required: true
        type: choice
        default: "check"
        options:
          - check
          - deploy
          - restart
  push:
    branches:
      - main

concurrency:
  group: overview-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      NOTION_SYNC_INTERVAL_SECONDS: ${{ vars.NOTION_SYNC_INTERVAL_SECONDS }}
      MATTERMOST_OVERVIEW_WEBHOOK: ${{ secrets.MATTERMOST_OVERVIEW_WEBHOOK }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOITON_OVERVIEW_DB_KEY: ${{ secrets.NOITON_OVERVIEW_DB_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy environment
        run: |
          required='DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_PATH TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET MATTERMOST_OVERVIEW_WEBHOOK NOTION_API_KEY NOITON_OVERVIEW_DB_KEY'
          for name in $required; do
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then
              echo "missing required deploy value: $name" >&2
              exit 1
            fi
          done

      - name: Generate env files from GitHub values
        run: sh .github/scripts/write-env-files.sh

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/overview_deploy_key
          chmod 600 ~/.ssh/overview_deploy_key
          ssh-keyscan -p "${DEPLOY_SSH_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Update clone on host
        run: |
          port="${DEPLOY_SSH_PORT:-22}"
          ssh -i ~/.ssh/overview_deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && git fetch origin main && git reset --hard origin/main"

      - name: Write env files on host
        run: |
          port="${DEPLOY_SSH_PORT:-22}"
          ssh -i ~/.ssh/overview_deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && mkdir -p backend infra"
          scp -i ~/.ssh/overview_deploy_key -P "$port" backend/.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/backend/.env"
          scp -i ~/.ssh/overview_deploy_key -P "$port" infra/.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/infra/.env"

      - name: Check on host
        run: |
          port="${DEPLOY_SSH_PORT:-22}"
          ssh -i ~/.ssh/overview_deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose config"

      - name: Apply deploy
        if: ${{ github.event_name == 'push' || inputs.apply == 'deploy' }}
        run: |
          port="${DEPLOY_SSH_PORT:-22}"
          ssh -i ~/.ssh/overview_deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose up -d --build"

      - name: Restart services
        if: ${{ inputs.apply == 'restart' }}
        run: |
          port="${DEPLOY_SSH_PORT:-22}"
          ssh -i ~/.ssh/overview_deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose restart"
